# Roles and prompts are owned by @lai/lai-agents, mounted by the application Profile.
- id: agent-mq-runtime
  disabled: false
  config:
    workspacePath: !!js process.env.LAI_WORKSPACE
    provider: !!js process.env.LAI_PROVIDER
    model: !!js process.env.LAI_MODEL
    maxParallelTasks: 1
    taskTimeoutMs: 2400000
    agentPreset: iqe-orchestrator
- id: agent-mq-mqtt
  disabled: false
  config:
    url: mqtt://127.0.0.1:1883
    inputTopic: dsh/mq/tasks
    outputTopic: dsh/mq/results
    blockMs: 2000
