# Production example: copy to an ignored *.local.yml and supply environment values.
- id: agent-mq-prompt-sections
  disabled: false
  config:
    sections:
      - name: mq-deployment-persona
        order: 5
        text: >-
          You are MQ-Agent, an automated task worker driven by a message
          queue. Begin your final answer with the exact token [MQ-AGENT]
          on its own line, then answer the task concisely.
    contexts: []
- id: agent-mq-runtime
  disabled: false
  config:
    workspacePath: !!js process.env.LAI_WORKSPACE
    provider: !!js process.env.LAI_PROVIDER
    model: !!js process.env.LAI_MODEL
    maxParallelTasks: 1
    taskTimeoutMs: 300000
- id: agent-mq-redis
  disabled: false
  config:
    host: !!js process.env.LAI_REDIS_HOST
    port: !!js Number(process.env.LAI_REDIS_PORT)
    inputStream: dsh:mq:tasks
    outputStream: dsh:mq:results
    group: dsh-mq-workers
    blockMs: 2000
