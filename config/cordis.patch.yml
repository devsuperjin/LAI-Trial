# Account settings are disabled through composition instead of editing web-app.
- id: ui-settings-account
  disabled: true
- id: account-controller
  disabled: true

# DSH patches cannot rename a plugin row: disable its frontend owner and add LAI's.
- id: web-runtime
  disabled: true
- insert:
    - id: lai-web-runtime
      name: '@lai/dsh-web-host'
      inject: [webStartup]
      config:
        distIndex: !!js process.env.LAI_WEB_DIST_INDEX
        openBrowser: !!js ctx.webStartup.openBrowser
        publicUrl: !!js ctx.webStartup.publicUrl

- insert:
    - id: lai-agents
      name: '@lai/lai-agents'

- id: dsh-superagent
  config:
    stateDir: !!js process.env.LAI_SUPERAGENT_STATE_DIR
